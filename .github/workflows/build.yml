          @Composable
          fun StatusCard(name: String, port: Int, isOn: Boolean) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.cardColors(containerColor = if (isOn) Purple1 else Color.White),
                  elevation = CardDefaults.cardElevation(4.dp)
              ) {
                  Row(modifier = Modifier.padding(20.dp), verticalAlignment = Alignment.CenterVertically) {
                      Box(modifier = Modifier.size(48.dp).clip(CircleShape).background(if (isOn) Color.White.copy(alpha = 0.25f) else BgColor), contentAlignment = Alignment.Center) {
                          Text(if (isOn) "▶" else "⏸", fontSize = 20.sp, color = if (isOn) Color.White else TextGray)
                      }
                      Spacer(Modifier.width(14.dp))
                      Column {
                          Text(name, fontSize = 16.sp, fontWeight = FontWeight.Bold, color = if (isOn) Color.White else TextDark)
                          Spacer(Modifier.height(2.dp))
                          Text(if (isOn) "يعمل — المنفذ $port" else "متوقف — المنفذ $port", fontSize = 12.sp, color = if (isOn) Color.White.copy(alpha = 0.85f) else TextGray)
                      }
                  }
              }
          }

          @Composable
          fun BigButton(isOn: Boolean, onClick: () -> Unit) {
              Button(onClick = onClick, modifier = Modifier.fillMaxWidth().height(60.dp), shape = RoundedCornerShape(20.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = if (isOn) Color(0xFFE53E3E) else Color(0xFF48BB78))) {
                  Text(if (isOn) "⏹ إيقاف" else "🚀 تشغيل", fontSize = 16.sp, fontWeight = FontWeight.Bold)
              }
          }

          @Composable
          fun NetworksCard(networks: List<NetworkIp>, onRefresh: () -> Unit) {
              Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFFEEF2FF)), elevation = CardDefaults.cardElevation(2.dp)) {
                  Column(modifier = Modifier.padding(16.dp)) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("📡 شبكاتك", fontSize = 14.sp, fontWeight = FontWeight.Bold, color = TextDark)
                          TextButton(onClick = onRefresh) { Text("🔄", fontSize = 14.sp) }
                      }
                      Spacer(Modifier.height(6.dp))
                      if (networks.isEmpty()) Text("لا توجد شبكات", fontSize = 12.sp, color = TextGray)
                      else networks.forEach { n ->
                          Row(modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(n.emoji, fontSize = 15.sp); Spacer(Modifier.width(8.dp))
                                  Text(n.label, fontSize = 12.sp, color = TextGray)
                              }
                              Text(n.ip, fontSize = 13.sp, fontWeight = FontWeight.Bold, color = if (n.isPermanent) Color(0xFF38A169) else TextDark)
                          }
                      }
                  }
              }
          }

          fun getFileName(ctx: android.content.Context, uri: Uri): String {
              var n = "file"
              try { ctx.contentResolver.query(uri, null, null, null, null)?.use { c -> if (c.moveToFirst()) { val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (i >= 0) n = c.getString(i) ?: "file" } } } catch (e: Exception) {}
              return n
          }
          EOF
          echo "✅ Done"
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowNet-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
