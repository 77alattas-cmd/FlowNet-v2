                          Spacer(Modifier.height(10.dp))
                          Text("منفذ $port", color = if (run) Color.White.copy(alpha = 0.9f) else Color(0xFF64748B), fontSize = 13.sp)
                      }
                  }
                  NetworksCard(nets, onR)
                  OutlinedTextField(value = port, onValueChange = { port = it.filter { c -> c.isDigit() }.take(5) },
                      label = { Text("المنفذ", fontSize = 12.sp) }, modifier = Modifier.fillMaxWidth(), singleLine = true, enabled = !run)
                  OutlinedTextField(value = pw, onValueChange = { pw = it.take(30) }, label = { Text("كلمة المرور", fontSize = 12.sp) },
                      visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth(), singleLine = true, enabled = !run)
                  Button(onClick = {
                      if (run) { ctx.stopService(Intent(ctx, Socks5ProxyService::class.java)); onChange(false) }
                      else {
                          val p = port.toIntOrNull() ?: 1080
                          val i = Intent(ctx, Socks5ProxyService::class.java).apply { putExtra("port", p); putExtra("password", pw) }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
                          onChange(true)
                      }
                  }, modifier = Modifier.fillMaxWidth().height(56.dp), shape = RoundedCornerShape(12.dp),
                     colors = ButtonDefaults.buttonColors(containerColor = if (run) Color(0xFFE53E3E) else Color(0xFF38A169))) {
                      Text(if (run) "إيقاف" else "🚀 تشغيل SOCKS5", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun FilesScreen(run: Boolean, nets: List<NetworkIp>, onR: () -> Unit, onChange: (Boolean) -> Unit) {
              val ctx = LocalContext.current
              var files by remember { mutableStateOf<List<Uri>>(emptyList()) }
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  if (uris.isNotEmpty()) files = files + uris
              }
              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(20.dp),
                     verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Text("مشاركة الملفات", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1E293B))
                  Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp),
                       colors = CardDefaults.cardColors(containerColor = if (run) Color(0xFF3182CE) else Color.White)) {
                      Column(modifier = Modifier.padding(20.dp)) {
                          Text(if (run) "يعمل" else "متوقف", color = if (run) Color.White else Color(0xFF1E293B), fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(8.dp))
                          Text("منفذ 8081", color = if (run) Color.White.copy(alpha = 0.9f) else Color(0xFF64748B), fontSize = 13.sp)
                      }
                  }
                  NetworksCard(nets, onR)
                  Button(onClick = { picker.launch(arrayOf("*/*")) }, modifier = Modifier.fillMaxWidth().height(50.dp),
                     shape = RoundedCornerShape(12.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF3182CE))) {
                      Text("📁 اختر ملفات", fontSize = 15.sp)
                  }
                  if (files.isNotEmpty()) {
                      Text("(${files.size} ملفات)", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1E293B))
                      files.forEachIndexed { i, u ->
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text(getFileName(ctx, u).take(28), fontSize = 12.sp, color = Color(0xFF64748B), modifier = Modifier.weight(1f))
                              TextButton(onClick = { files = files.filterIndexed { j, _ -> j != i } }) {
                                  Text("حذف", fontSize = 11.sp, color = Color(0xFFE53E3E))
                              }
                          }
                      }
                  }
                  Button(onClick = {
                      if (run) { ctx.stopService(Intent(ctx, FileServerService::class.java)); onChange(false) }
                      else {
                          if (files.isEmpty()) return@Button
                          val i = Intent(ctx, FileServerService::class.java).apply {
                              putStringArrayListExtra("files", ArrayList(files.map { it.toString() }))
                              putExtra("port", 8081)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
                          onChange(true)
                      }
                  }, enabled = run || files.isNotEmpty(), modifier = Modifier.fillMaxWidth().height(56.dp),
                     shape = RoundedCornerShape(12.dp),
                     colors = ButtonDefaults.buttonColors(
                         containerColor = if (run) Color(0xFFE53E3E) else Color(0xFF38A169),
                         disabledContainerColor = Color(0xFFCBD5E0))) {
                      Text(if (run) "إيقاف" else "🚀 تشغيل", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }

          fun getFileName(ctx: android.content.Context, uri: Uri): String {
              var n = "file"
              try { ctx.contentResolver.query(uri, null, null, null, null)?.use { c -> if (c.moveToFirst()) { val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (i >= 0) n = c.getString(i) ?: "file" } } } catch (e: Exception) {}
              return n
          }
          EOF
          echo "✅ MainActivity جاهز"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowNet-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
