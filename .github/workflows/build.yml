          cat > app/src/main/java/com/flownet/app/WifiDirectManager.kt << 'EOF'
          package com.flownet.app
          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.wifi.p2p.WifiP2pGroup
          import android.net.wifi.p2p.WifiP2pManager
          import android.os.Build
          import android.os.Handler
          import androidx.core.content.ContextCompat
          class WifiDirectManager(private val context: Context) {
              private val manager: WifiP2pManager? = context.getSystemService(Context.WIFI_P2P_SERVICE) as? WifiP2pManager
              private var channel: WifiP2pManager.Channel? = null
              fun isSupported(): Boolean = manager != null
              fun hasPermission(): Boolean = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  ContextCompat.checkSelfPermission(context, Manifest.permission.NEARBY_WIFI_DEVICES) == PackageManager.PERMISSION_GRANTED
              } else {
                  ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
              }
              private fun ensureChannel(): WifiP2pManager.Channel? {
                  if (channel == null && manager != null) channel = manager.initialize(context, context.mainLooper, null)
                  return channel
              }
              @SuppressLint("MissingPermission")
              fun createGroupSimple(onSuccess: (String, String) -> Unit, onFailure: (String) -> Unit) {
                  val mgr = manager ?: return onFailure("WiFi Direct غير متوفر")
                  if (!hasPermission()) return onFailure("يحتاج إذن WiFi Direct")
                  channel = null
                  val ch = ensureChannel() ?: return onFailure("فشل تهيئة القناة")
                  try {
                      mgr.removeGroup(ch, object : WifiP2pManager.ActionListener {
                          override fun onSuccess() { startCreate(mgr, ch, onSuccess, onFailure) }
                          override fun onFailure(reason: Int) { startCreate(mgr, ch, onSuccess, onFailure) }
                      })
                  } catch (e: Exception) { startCreate(mgr, ch, onSuccess, onFailure) }
              }
              private fun startCreate(mgr: WifiP2pManager, ch: WifiP2pManager.Channel, onSuccess: (String, String) -> Unit, onFailure: (String) -> Unit) {
                  try {
                      mgr.createGroup(ch, object : WifiP2pManager.ActionListener {
                          override fun onSuccess() {
                              Handler(context.mainLooper).postDelayed({
                                  try {
                                      mgr.requestGroupInfo(ch) { group: WifiP2pGroup? ->
                                          if (group == null) onFailure("تم القبول لكن لم تُنشأ المجموعة")
                                          else onSuccess(group.networkName ?: "DIRECT-FL", group.passphrase ?: "12345678")
                                      }
                                  } catch (e: Exception) { onFailure("خطأ: ${e.message}") }
                              }, 2500)
                          }
                          override fun onFailure(reason: Int) { onFailure(explainError(reason)) }
                      })
                  } catch (e: Exception) { onFailure("خطأ: ${e.message}") }
              }
              fun removeGroup(onDone: () -> Unit = {}) {
                  val mgr = manager ?: return onDone()
                  val ch = channel ?: return onDone()
                  try {
                      mgr.removeGroup(ch, object : WifiP2pManager.ActionListener {
                          override fun onSuccess() { onDone() }
                          override fun onFailure(reason: Int) { onDone() }
                      })
                  } catch (e: Exception) { onDone() }
              }
              private fun explainError(reason: Int): String = when (reason) {
                  WifiP2pManager.BUSY -> "مشغول — أغلق Hotspot وانتظر"
                  WifiP2pManager.ERROR -> "خطأ داخلي — أعد تشغيل WiFi"
                  WifiP2pManager.P2P_UNSUPPORTED -> "غير مدعوم"
                  else -> "فشل بكود $reason"
              }
          }
          EOF
          cat > app/src/main/java/com/flownet/app/FileServerService.kt << 'EOF'
          package com.flownet.app
          import android.app.*
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.provider.OpenableColumns
          import androidx.core.app.NotificationCompat
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket
          class FileServerService : Service() {
              private var ss: ServerSocket? = null
              private var th: Thread? = null
              private var files: List<Uri> = emptyList()
              private var port = 8081
              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  port = i?.getIntExtra("port", 8081) ?: 8081
                  files = (i?.getStringArrayListExtra("files") ?: arrayListOf()).map { Uri.parse(it) }
                  startForeground(1001, notif())
                  th?.interrupt(); try { ss?.close() } catch (e: Exception) {}
                  th = Thread {
                      try {
                          ss = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) {
                              val c = ss?.accept() ?: break
                              Thread { handle(c) }.start()
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }.also { it.start() }
                  return START_STICKY
              }
              private fun handle(s: Socket) {
                  val cip = getClientIp(s)
                  s.use { sock ->
                      try {
                          val r = sock.getInputStream().bufferedReader()
                          val rl = r.readLine() ?: return
                          val parts = rl.split(" ")
                          if (parts.size < 2) return
                          val path = parts[1]
                          val o = sock.getOutputStream()
                          when {
                              path == "/" || path == "/index.html" -> {
                                  val b = html().toByteArray(Charsets.UTF_8)
                                  o.write("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: ${b.size}\r\nConnection: close\r\n\r\n".toByteArray())
                                  o.write(b)
                              }
                              path.startsWith("/file/") -> {
                                  val i = path.removePrefix("/file/").toIntOrNull()
                                  if (i != null && i in files.indices) serve(o, files[i], cip) else o.write("HTTP/1.1 404 Not Found\r\n\r\n".toByteArray())
                              }
                              else -> o.write("HTTP/1.1 404 Not Found\r\n\r\n".toByteArray())
                          }
                          o.flush()
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }
              private fun serve(o: OutputStream, uri: Uri, cip: String) {
                  try {
                      val ins = contentResolver.openInputStream(uri) ?: return
                      val fn = fname(uri)
                      val mt = contentResolver.getType(uri) ?: "application/octet-stream"
                      val b = ins.use { it.readBytes() }
                      o.write("HTTP/1.1 200 OK\r\nContent-Type: $mt\r\nContent-Length: ${b.size}\r\nContent-Disposition: attachment; filename=\"$fn\"\r\nConnection: close\r\n\r\n".toByteArray())
                      o.write(b)
                      ProxyStats.addBytesSent(b.size.toLong(), cip)
                      ProxyStats.logRequest("GET", "fileserver", "/$fn", "FILES", b.size.toLong(), cip)
                  } catch (e: Exception) { e.printStackTrace() }
              }
              private fun fname(uri: Uri): String {
                  var n = "file"
                  try { contentResolver.query(uri, null, null, null, null)?.use { c -> if (c.moveToFirst()) { val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (i >= 0) n = c.getString(i) ?: "file" } } } catch (e: Exception) {}
                  return n
              }
              private fun html(): String {
                  val lst = files.mapIndexed { i, u -> "<li><a href=\"/file/$i\">📄 ${fname(u)}</a></li>" }.joinToString("")
                  val body = if (files.isEmpty()) "<p>لا توجد ملفات</p>" else "<ul>$lst</ul>"
                  return "<!DOCTYPE html><html dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>FlowNet</title><style>body{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;margin:0}.c{background:#fff;border-radius:24px;padding:24px;max-width:600px;margin:0 auto}h1{color:#667eea;text-align:center}ul{list-style:none;padding:0}li{padding:16px;margin:8px 0;background:#f8fafc;border-radius:16px}a{color:#1e293b;text-decoration:none;font-weight:bold}</style></head><body><div class='c'><h1>🌐 FlowNet</h1>$body</div></body></html>"
              }
              private fun notif(): Notification {
                  val c = "fs"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel(c, "FlowNet Files", NotificationManager.IMPORTANCE_LOW))
                  return NotificationCompat.Builder(this, c).setContentTitle("FlowNet Files").setContentText("منفذ $port").setSmallIcon(android.R.drawable.ic_menu_share).setOngoing(true).build()
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { th?.interrupt(); try { ss?.close() } catch (e: Exception) {}; super.onDestroy() }
              companion object { fun getClientIp(s: Socket): String = try { (s.remoteSocketAddress as? InetSocketAddress)?.address?.hostAddress ?: "unknown" } catch (e: Exception) { "unknown" } }
          }
          EOF
          cat > app/src/main/java/com/flownet/app/Socks5ProxyService.kt << 'EOF'
          package com.flownet.app
          import android.app.*
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.*
          import java.util.concurrent.Executors
          class Socks5ProxyService : Service() {
              private var ss: ServerSocket? = null
              private var th: Thread? = null
              private var port = 1080
              private var pw = ""
              private val pool = Executors.newCachedThreadPool()
              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  port = i?.getIntExtra("port", 1080) ?: 1080
                  pw = i?.getStringExtra("password") ?: ""
                  startForeground(1002, notif())
                  try { ss?.close() } catch (e: Exception) {}
                  th?.interrupt()
                  th = Thread {
                      try {
                          ss = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) { val c = ss?.accept() ?: break; pool.execute { handle(c) } }
                      } catch (e: Exception) { e.printStackTrace() }
                  }.also { it.start() }
                  return START_STICKY
              }
              private fun handle(cl: Socket) {
                  val cip = FileServerService.getClientIp(cl)
                  ProxyStats.connectionOpened()
                  try {
                      cl.use { s ->
                          s.soTimeout = 30000
                          val ins = s.getInputStream(); val out = s.getOutputStream()
                          if (ins.read() != 0x05) return
                          val n = ins.read(); if (n <= 0) return; ins.read(ByteArray(n))
                          if (pw.isNotEmpty()) {
                              out.write(byteArrayOf(0x05, 0x02)); out.flush()
                              if (ins.read() != 0x01) return
                              val ul = ins.read(); ins.read(ByteArray(ul))
                              val pl = ins.read(); val p = ByteArray(pl); ins.read(p)
                              if (String(p) != pw) { out.write(byteArrayOf(0x01, 0x01)); out.flush(); return }
                              out.write(byteArrayOf(0x01, 0x00)); out.flush()
                          } else { out.write(byteArrayOf(0x05, 0x00)); out.flush() }
                          if (ins.read() != 0x05) return
                          val cmd = ins.read(); ins.read(); val at = ins.read()
                          if (cmd != 0x01) return
                          val host = when (at) {
                              0x01 -> { val a = ByteArray(4); ins.read(a); a.joinToString(".") { (it.toInt() and 0xFF).toString() } }
                              0x03 -> { val l = ins.read(); val d = ByteArray(l); ins.read(d); String(d) }
                              0x04 -> { val a = ByteArray(16); ins.read(a); InetAddress.getByAddress(a).hostAddress ?: return }
                              else -> return
                          }
                          val tp = (ins.read() shl 8) or ins.read()
                          ProxyStats.logRequest("CONNECT", host, ":$tp", "SOCKS5", 0, cip)
                          var t: Socket? = null
                          try {
                              t = Socket(); t.connect(InetSocketAddress(host, tp), 10000)
                              out.write(byteArrayOf(0x05, 0x00, 0x00, 0x01, 0, 0, 0, 0, 0, 0)); out.flush()
                              val t1 = Thread { relay(s.getInputStream(), t.getOutputStream(), true, cip) }
                              val t2 = Thread { relay(t.getInputStream(), s.getOutputStream(), false, cip) }
                              t1.start(); t2.start(); t1.join(); t2.join()
                          } catch (e: Exception) {
                              try { out.write(byteArrayOf(0x05, 0x05, 0x00, 0x01, 0, 0, 0, 0, 0, 0)); out.flush() } catch (ex: Exception) {}
                          } finally { try { t?.close() } catch (e: Exception) {} }
                      }
                  } catch (e: Exception) { e.printStackTrace() } finally { ProxyStats.connectionClosed() }
              }
              private fun relay(i: InputStream, o: OutputStream, up: Boolean, ip: String) {
                  try { val b = ByteArray(8192); while (!Thread.currentThread().isInterrupted) { val n = i.read(b); if (n <= 0) break; o.write(b, 0, n); o.flush(); if (up) ProxyStats.addBytesSent(n.toLong(), ip) else ProxyStats.addBytesReceived(n.toLong(), ip) } } catch (e: Exception) {}
              }
              private fun notif(): Notification {
                  val c = "s5"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel(c, "FlowNet SOCKS5", NotificationManager.IMPORTANCE_LOW))
                  return NotificationCompat.Builder(this, c).setContentTitle("FlowNet SOCKS5").setContentText("منفذ $port").setSmallIcon(android.R.drawable.ic_menu_share).setOngoing(true).build()
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { th?.interrupt(); try { ss?.close() } catch (e: Exception) {}; pool.shutdownNow(); super.onDestroy() }
          }
          EOF
          cat > app/src/main/java/com/flownet/app/HttpProxyService.kt << 'EOF'
          package com.flownet.app
          import android.app.*
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import java.io.*
          import java.net.*
          import java.util.Base64
          import java.util.concurrent.Executors
          class HttpProxyService : Service() {
              private var ss: ServerSocket? = null
              private var th: Thread? = null
              private var port = 8080
              private var pw = ""
              private val pool = Executors.newCachedThreadPool()
              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  port = i?.getIntExtra("port", 8080) ?: 8080
                  pw = i?.getStringExtra("password") ?: ""
                  startForeground(1003, notif())
                  try { ss?.close() } catch (e: Exception) {}
                  th?.interrupt()
                  th = Thread {
                      try {
                          ss = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) { val c = ss?.accept() ?: break; pool.execute { handle(c) } }
                      } catch (e: Exception) { e.printStackTrace() }
                  }.also { it.start() }
                  return START_STICKY
              }
              private fun handle(cl: Socket) {
                  val cip = FileServerService.getClientIp(cl)
                  ProxyStats.connectionOpened()
                  try {
                      cl.use { s ->
                          s.soTimeout = 60000
                          val r = BufferedReader(InputStreamReader(s.getInputStream()))
                          val o = s.getOutputStream()
                          val rl = r.readLine() ?: return
                          val p = rl.split(" "); if (p.size < 2) return
                          val m = p[0]; val u = p[1]
                          val hs = mutableListOf<Pair<String, String>>()
                          var auth: String? = null
                          while (true) {
                              val l = r.readLine() ?: break
                              if (l.isEmpty()) break
                              val idx = l.indexOf(':'); if (idx > 0) {
                                  val k = l.substring(0, idx).trim(); val v = l.substring(idx + 1).trim()
                                  if (k.equals("Proxy-Authorization", true)) auth = v else hs.add(k to v)
                              }
                          }
                          if (pw.isNotEmpty()) {
                              var ok = false
                              if (auth != null && auth.startsWith("Basic ", true)) {
                                  try {
                                      val d = String(Base64.getDecoder().decode(auth.substring(6).trim()))
                                      val ci = d.indexOf(':')
                                      if (ci >= 0 && d.substring(ci + 1) == pw) ok = true
                                  } catch (e: Exception) {}
                              }
                              if (!ok) { o.write("HTTP/1.1 407 Proxy Authentication Required\r\nProxy-Authenticate: Basic realm=\"FlowNet\"\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".toByteArray()); o.flush(); return }
                          }
                          if (m.equals("CONNECT", true)) {
                              val hp = u.split(":"); val h = hp[0]; val tp = hp.getOrNull(1)?.toIntOrNull() ?: 443
                              ProxyStats.logRequest("CONNECT", h, ":$tp", "HTTP", 0, cip)
                              val t = Socket(); t.connect(InetSocketAddress(h, tp), 15000)
                              o.write("HTTP/1.1 200 Connection Established\r\n\r\n".toByteArray()); o.flush()
                              val t1 = Thread { relay(s.getInputStream(), t.getOutputStream(), true, cip) }
                              val t2 = Thread { relay(t.getInputStream(), s.getOutputStream(), false, cip) }
                              t1.start(); t2.start(); t1.join(); t2.join()
                              try { t.close() } catch (e: Exception) {}
                          } else {
                              val uri = URI(u); val h = uri.host ?: return
                              val tp = if (uri.port > 0) uri.port else 80
                              val path = (uri.rawPath ?: "/") + (uri.rawQuery?.let { "?$it" } ?: "")
                              ProxyStats.logRequest(m, h, path, "HTTP", 0, cip)
                              val t = Socket(); t.connect(InetSocketAddress(h, tp), 15000)
                              val to = t.getOutputStream()
                              val sb = StringBuilder(); sb.append("$m $path HTTP/1.1\r\nHost: $h\r\n")
                              hs.forEach { (k, v) -> if (!k.equals("Proxy-Connection", true) && !k.equals("Connection", true)) sb.append("$k: $v\r\n") }
                              sb.append("Connection: close\r\n\r\n")
                              to.write(sb.toString().toByteArray()); to.flush()
                              relay(t.getInputStream(), o, false, cip)
                              try { t.close() } catch (e: Exception) {}
                          }
                      }
                  } catch (e: Exception) { e.printStackTrace() } finally { ProxyStats.connectionClosed() }
              }
              private fun relay(i: InputStream, o: OutputStream, up: Boolean, ip: String) {
                  try { val b = ByteArray(8192); while (!Thread.currentThread().isInterrupted) { val n = i.read(b); if (n <= 0) break; o.write(b, 0, n); o.flush(); if (up) ProxyStats.addBytesSent(n.toLong(), ip) else ProxyStats.addBytesReceived(n.toLong(), ip) } } catch (e: Exception) {}
              }
              private fun notif(): Notification {
                  val c = "h"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel(c, "FlowNet HTTP", NotificationManager.IMPORTANCE_LOW))
                  return NotificationCompat.Builder(this, c).setContentTitle("FlowNet HTTP").setContentText("منفذ $port").setSmallIcon(android.R.drawable.ic_menu_share).setOngoing(true).build()
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { th?.interrupt(); try { ss?.close() } catch (e: Exception) {}; pool.shutdownNow(); super.onDestroy() }
          }
