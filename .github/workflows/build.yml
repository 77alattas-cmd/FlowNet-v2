          EOF
          
          cat > app/src/main/java/com/flownet/app/ProxyStats.kt << 'EOF'
          package com.flownet.app

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          data class RequestLog(val timestamp: Long, val method: String, val host: String, val path: String, val type: String, val size: Long = 0)
          data class DeviceStats(val ip: String, val requestCount: Long = 0, val bytesReceived: Long = 0, val bytesSent: Long = 0, val lastSeen: Long = System.currentTimeMillis())

          object ProxyStats {
              private val _activeConnections = MutableStateFlow(0)
              val activeConnections: StateFlow<Int> = _activeConnections.asStateFlow()
              private val _bytesReceived = MutableStateFlow(0L)
              val bytesReceived: StateFlow<Long> = _bytesReceived.asStateFlow()
              private val _bytesSent = MutableStateFlow(0L)
              val bytesSent: StateFlow<Long> = _bytesSent.asStateFlow()
              private val _totalRequests = MutableStateFlow(0L)
              val totalRequests: StateFlow<Long> = _totalRequests.asStateFlow()
              private val _recentRequests = MutableStateFlow<List<RequestLog>>(emptyList())
              val recentRequests: StateFlow<List<RequestLog>> = _recentRequests.asStateFlow()
              private val _devices = MutableStateFlow<Map<String, DeviceStats>>(emptyMap())
              val devices: StateFlow<Map<String, DeviceStats>> = _devices.asStateFlow()

              fun connectionOpened() { _activeConnections.value++ }
              fun connectionClosed() { if (_activeConnections.value > 0) _activeConnections.value-- }
              fun addBytesReceived(n: Long, ip: String = "unknown") { _bytesReceived.value += n; recordDevice(ip, recv = n) }
              fun addBytesSent(n: Long, ip: String = "unknown") { _bytesSent.value += n; recordDevice(ip, sent = n) }
              fun logRequest(method: String, host: String, path: String, type: String, size: Long = 0, ip: String = "unknown") {
                  _totalRequests.value++
                  recordDevice(ip, requests = 1)
                  _recentRequests.value = (listOf(RequestLog(System.currentTimeMillis(), method, host, path, type, size)) + _recentRequests.value).take(50)
              }
              private fun recordDevice(ip: String, requests: Long = 0, recv: Long = 0, sent: Long = 0) {
                  if (ip == "unknown" || ip.isEmpty()) return
                  val c = _devices.value
                  val e = c[ip] ?: DeviceStats(ip = ip)
                  _devices.value = c + (ip to e.copy(
                      requestCount = e.requestCount + requests,
                      bytesReceived = e.bytesReceived + recv,
                      bytesSent = e.bytesSent + sent,
                      lastSeen = System.currentTimeMillis()
                  ))
              }
              fun reset() {
                  _bytesReceived.value = 0; _bytesSent.value = 0; _totalRequests.value = 0
                  _recentRequests.value = emptyList(); _devices.value = emptyMap()
              }
              fun formatBytes(b: Long): String = when {
                  b < 1024 -> "$b B"
                  b < 1048576 -> String.format("%.1f KB", b / 1024.0)
                  b < 1073741824 -> String.format("%.2f MB", b / 1048576.0)
                  else -> String.format("%.2f GB", b / 1073741824.0)
              }
          }
          EOF
          
          cat > app/src/main/java/com/flownet/app/NetworkInfo.kt << 'EOF'
          package com.flownet.app

          import java.net.Inet4Address
          import java.net.NetworkInterface

          data class NetworkIp(val label: String, val ip: String, val emoji: String, val isPermanent: Boolean = false, val ifaceName: String = "")

          fun getAllNetworkIps(): List<NetworkIp> {
              val r = mutableListOf<NetworkIp>()
              val seen = mutableSetOf<String>()
              try {
                  val ifs = NetworkInterface.getNetworkInterfaces() ?: return r
                  while (ifs.hasMoreElements()) {
                      val iface = ifs.nextElement()
                      if (!iface.isUp || iface.isLoopback) continue
                      val name = iface.name
                      val addrs = iface.inetAddresses
                      while (addrs.hasMoreElements()) {
                          val a = addrs.nextElement()
                          if (a.isLoopbackAddress || a !is Inet4Address) continue
                          val ip = a.hostAddress ?: continue
                          if (ip in seen) continue
                          seen.add(ip)
                          r.add(when {
                              name.startsWith("p2p") || ip.startsWith("192.168.49.") -> NetworkIp("WiFi Direct", ip, "📡", true, name)
                              ip.startsWith("192.168.43.") -> NetworkIp("Hotspot", ip, "🔥", false, name)
                              ip.startsWith("192.168.42.") -> NetworkIp("USB", ip, "🔌", false, name)
                              else -> NetworkIp("WiFi / LAN", ip, "📶", false, name)
                          })
                      }
                  }
              } catch (e: Exception) {}
              return r.sortedWith(compareByDescending<NetworkIp> { it.isPermanent }.thenBy { it.ip })
          }

          fun getLocalIpAddress(): String = getAllNetworkIps().firstOrNull()?.ip ?: "غير متاح"
          EOF
          
          cat > app/src/main/java/com/flownet/app/QrCodeGenerator.kt << 'EOF'
          package com.flownet.app

          import android.graphics.Bitmap
          import android.graphics.Color
          import com.google.zxing.BarcodeFormat
          import com.google.zxing.EncodeHintType
          import com.google.zxing.qrcode.QRCodeWriter
          import com.google.zxing.qrcode.decoder.ErrorCorrectionLevel

          object QrCodeGenerator {
              fun generateWifiQr(ssid: String, password: String, size: Int = 600): Bitmap? = try {
                  val content = if (password.isEmpty()) "WIFI:S:$ssid;T:nopass;;"
                                else "WIFI:S:$ssid;T:WPA;P:$password;;"
                  val hints = mapOf(
                      EncodeHintType.ERROR_CORRECTION to ErrorCorrectionLevel.M,
                      EncodeHintType.CHARACTER_SET to "UTF-8",
                      EncodeHintType.MARGIN to 1
                  )
                  val m = QRCodeWriter().encode(content, BarcodeFormat.QR_CODE, size, size, hints)
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.RGB_565)
                  for (x in 0 until size) for (y in 0 until size)
                      bmp.setPixel(x, y, if (m.get(x, y)) Color.BLACK else Color.WHITE)
                  bmp
              } catch (e: Exception) { e.printStackTrace(); null }
          }
          EOF
          
          cat > app/src/main/java/com/flownet/app/WifiDirectManager.kt << 'EOF'
          package com.flownet.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.wifi.p2p.WifiP2pConfig
          import android.net.wifi.p2p.WifiP2pGroup
          import android.net.wifi.p2p.WifiP2pManager
          import android.os.Build
          import android.os.Handler
          import androidx.core.content.ContextCompat
          import java.lang.reflect.Method

          class WifiDirectManager(private val context: Context) {

              private val manager: WifiP2pManager? =
                  context.getSystemService(Context.WIFI_P2P_SERVICE) as? WifiP2pManager
              private var channel: WifiP2pManager.Channel? = null

              fun hasPermission(): Boolean = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  ContextCompat.checkSelfPermission(context, Manifest.permission.NEARBY_WIFI_DEVICES) == PackageManager.PERMISSION_GRANTED
              } else {
                  ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
              }

              private fun ensureChannel(): WifiP2pManager.Channel? {
                  if (channel == null && manager != null) {
                      channel = manager.initialize(context, context.mainLooper, null)
                  }
                  return channel
              }

              @SuppressLint("MissingPermission")
              fun createCustomGroup(
                  suffix: String,
                  password: String,
                  onSuccess: (ssid: String, pass: String) -> Unit,
                  onFailure: (String) -> Unit
              ) {
                  val mgr = manager ?: return onFailure("WiFi Direct غير مدعوم")
                  if (!hasPermission()) return onFailure("يحتاج إذن WiFi Direct")
                  val ch = ensureChannel() ?: return onFailure("فشل تهيئة القناة")

                  val cleanSuffix = suffix.trim().replace(Regex("[^A-Za-z0-9_-]"), "").take(20)
                  val ssid = "DIRECT-FL-" + cleanSuffix.ifEmpty { "Net" }

                  if (password.length < 8) {
                      onFailure("كلمة المرور يجب أن تكون 8 أحرف على الأقل")
                      return
                  }

                  try {
                      val config = WifiP2pConfig.Builder()
                          .setNetworkName(ssid)
                          .setPassphrase(password)
                          .build()

                      val method: Method = mgr.javaClass.getMethod(
                          "createGroup",
                          WifiP2pManager.Channel::class.java,
                          WifiP2pConfig::class.java,
                          WifiP2pManager.ActionListener::class.java
                      )

                      val listener = object : WifiP2pManager.ActionListener {
                          override fun onSuccess() {
                              Handler(context.mainLooper).postDelayed({
                                  mgr.requestGroupInfo(ch) { group: WifiP2pGroup? ->
                                      if (group == null) onFailure("لم يتم إنشاء المجموعة")
                                      else onSuccess(group.networkName ?: ssid, group.passphrase ?: password)
                                  }
                              }, 1500)
                          }
                          override fun onFailure(reason: Int) { onFailure(translate(reason)) }
                      }

                      method.invoke(mgr, ch, config, listener)
                  } catch (e: NoSuchMethodException) {
                      try {
                          mgr.createGroup(ch, object : WifiP2pManager.ActionListener {
                              override fun onSuccess() {
                                  Handler(context.mainLooper).postDelayed({
                                      mgr.requestGroupInfo(ch) { group: WifiP2pGroup? ->
                                          if (group == null) onFailure("لم يتم إنشاء المجموعة")
                                          else onSuccess(group.networkName ?: "DIRECT-XX", group.passphrase ?: "")
                                      }
                                  }, 1500)
                              }
                              override fun onFailure(reason: Int) { onFailure(translate(reason)) }
                          })
                      } catch (ex: Exception) {
                          onFailure("فشل: ${ex.message}")
                      }
                  } catch (e: SecurityException) {
                      onFailure("صلاحية مرفوضة")
                  } catch (e: Exception) {
                      onFailure("خطأ: ${e.message}")
                  }
              }

              fun removeGroup(onDone: () -> Unit = {}) {
                  val mgr = manager ?: return onDone()
                  val ch = channel ?: return onDone()
                  try {
                      mgr.removeGroup(ch, object : WifiP2pManager.ActionListener {
                          override fun onSuccess() { onDone() }
                          override fun onFailure(reason: Int) { onDone() }
                      })
                  } catch (e: Exception) { onDone() }
              }

              private fun translate(r: Int): String = when (r) {
                  WifiP2pManager.BUSY -> "WiFi Direct مشغول — أغلق Hotspot وانتظر 10 ثوان"
                  WifiP2pManager.ERROR -> "خطأ داخلي — جرّب إعادة تشغيل WiFi"
                  WifiP2pManager.P2P_UNSUPPORTED -> "غير مدعوم على هذا الجهاز"
                  else -> "فشل: كود $r"
              }
          }
          EOF
          
          cat > app/src/main/java/com/flownet/app/FileServerService.kt << 'EOF'
          package com.flownet.app

          import android.app.*
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.provider.OpenableColumns
          import androidx.core.app.NotificationCompat
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket

          class FileServerService : Service() {
              private var ss: ServerSocket? = null
              private var th: Thread? = null
              private var files: List<Uri> = emptyList()
              private var port = 8081

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  port = i?.getIntExtra("port", 8081) ?: 8081
                  files = (i?.getStringArrayListExtra("files") ?: arrayListOf()).map { Uri.parse(it) }
                  startForeground(1001, notif())
                  th?.interrupt(); try { ss?.close() } catch (e: Exception) {}
                  th = Thread {
                      try {
                          ss = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) {
                              val c = ss?.accept() ?: break
                              Thread { handle(c) }.start()
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }.also { it.start() }
                  return START_STICKY
              }

              private fun handle(s: Socket) {
                  val cip = getClientIp(s)
                  s.use { sock ->
                      try {
                          val r = sock.getInputStream().bufferedReader()
                          val rl = r.readLine() ?: return
                          val parts = rl.split(" ")
                          if (parts.size < 2) return
                          val path = parts[1]
                          val o = sock.getOutputStream()
                          when {
                              path == "/" || path == "/index.html" -> {
                                  val b = html().toByteArray(Charsets.UTF_8)
                                  o.write("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: ${b.size}\r\nConnection: close\r\n\r\n".toByteArray())
                                  o.write(b)
                              }
                              path.startsWith("/file/") -> {
                                  val i = path.removePrefix("/file/").toIntOrNull()
                                  if (i != null && i in files.indices) serve(o, files[i], cip)
                                  else o.write("HTTP/1.1 404 Not Found\r\n\r\n".toByteArray())
                              }
                              else -> o.write("HTTP/1.1 404 Not Found\r\n\r\n".toByteArray())
                          }
                          o.flush()
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }

              private fun serve(o: OutputStream, uri: Uri, cip: String) {
                  try {
                      val ins = contentResolver.openInputStream(uri) ?: return
                      val fn = fname(uri)
                      val mt = contentResolver.getType(uri) ?: "application/octet-stream"
                      val b = ins.use { it.readBytes() }
                      o.write("HTTP/1.1 200 OK\r\nContent-Type: $mt\r\nContent-Length: ${b.size}\r\nContent-Disposition: attachment; filename=\"$fn\"\r\nConnection: close\r\n\r\n".toByteArray())
                      o.write(b)
                      ProxyStats.addBytesSent(b.size.toLong(), cip)
                      ProxyStats.logRequest("GET", "fileserver", "/$fn", "FILES", b.size.toLong(), cip)
                  } catch (e: Exception) { e.printStackTrace() }
              }

              private fun fname(uri: Uri): String {
                  var n = "file"
                  try { contentResolver.query(uri, null, null, null, null)?.use { c -> if (c.moveToFirst()) { val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (i >= 0) n = c.getString(i) ?: "file" } } } catch (e: Exception) {}
                  return n
              }

              private fun html(): String {
                  val lst = files.mapIndexed { i, u -> "<li><a href=\"/file/$i\">📄 ${fname(u)}</a></li>" }.joinToString("")
                  val body = if (files.isEmpty()) "<p>لا توجد ملفات</p>" else "<ul>$lst</ul>"
                  return "<!DOCTYPE html><html dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>FlowNet</title><style>body{font-family:sans-serif;background:#f4f7fc;padding:20px}h1{color:#3182ce}.c{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}ul{list-style:none;padding:0}li{padding:14px;margin:8px 0;background:#f8fafc;border-radius:10px}a{color:#1e293b;text-decoration:none;font-weight:bold}</style></head><body><div class='c'><h1>🌐 FlowNet</h1>$body</div></body></html>"
              }

              private fun notif(): Notification {
                  val c = "fs"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel(c, "FlowNet Files", NotificationManager.IMPORTANCE_LOW))
                  return NotificationCompat.Builder(this, c).setContentTitle("FlowNet Files").setContentText("منفذ $port").setSmallIcon(android.R.drawable.ic_menu_share).setOngoing(true).build()
              }

              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { th?.interrupt(); try { ss?.close() } catch (e: Exception) {}; super.onDestroy() }

              companion object {
                  fun getClientIp(s: Socket): String = try { (s.remoteSocketAddress as? InetSocketAddress)?.address?.hostAddress ?: "unknown" } catch (e: Exception) { "unknown" }
              }
          }
          EOF
          
          cat > app/src/main/java/com/flownet/app/Socks5ProxyService.kt << 'EOF'
          package com.flownet.app

          import android.app.*
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.*
          import java.util.concurrent.Executors

          class Socks5ProxyService : Service() {
              private var ss: ServerSocket? = null
              private var th: Thread? = null
              private var port = 1080
              private var pw = ""
              private val pool = Executors.newCachedThreadPool()

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  port = i?.getIntExtra("port", 1080) ?: 1080
                  pw = i?.getStringExtra("password") ?: ""
                  startForeground(1002, notif())
                  try { ss?.close() } catch (e: Exception) {}
                  th?.interrupt()
                  th = Thread {
                      try {
                          ss = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) {
                              val c = ss?.accept() ?: break
                              pool.execute { handle(c) }
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }.also { it.start() }
                  return START_STICKY
              }

              private fun handle(cl: Socket) {
                  val cip = FileServerService.getClientIp(cl)
                  ProxyStats.connectionOpened()
                  try {
                      cl.use { s ->
                          s.soTimeout = 30000
                          val ins = s.getInputStream(); val out = s.getOutputStream()
                          if (ins.read() != 0x05) return
                          val n = ins.read(); if (n <= 0) return; ins.read(ByteArray(n))
                          if (pw.isNotEmpty()) {
                              out.write(byteArrayOf(0x05, 0x02)); out.flush()
                              if (ins.read() != 0x01) return
                              val ul = ins.read(); ins.read(ByteArray(ul))
                              val pl = ins.read(); val p = ByteArray(pl); ins.read(p)
                              if (String(p) != pw) { out.write(byteArrayOf(0x01, 0x01)); out.flush(); return }
                              out.write(byteArrayOf(0x01, 0x00)); out.flush()
                          } else { out.write(byteArrayOf(0x05, 0x00)); out.flush() }
                          if (ins.read() != 0x05) return
                          val cmd = ins.read(); ins.read(); val at = ins.read()
                          if (cmd != 0x01) return
                          val host = when (at) {
                              0x01 -> { val a = ByteArray(4); ins.read(a); a.joinToString(".") { (it.toInt() and 0xFF).toString() } }
                              0x03 -> { val l = ins.read(); val d = ByteArray(l); ins.read(d); String(d) }
                              0x04 -> { val a = ByteArray(16); ins.read(a); InetAddress.getByAddress(a).hostAddress ?: return }
                              else -> return
                          }
                          val tp = (ins.read() shl 8) or ins.read()
                          ProxyStats.logRequest("CONNECT", host, ":$tp", "SOCKS5", 0, cip)
                          var t: Socket? = null
                          try {
                              t = Socket(); t.connect(InetSocketAddress(host, tp), 10000)
                              out.write(byteArrayOf(0x05, 0x00, 0x00, 0x01, 0, 0, 0, 0, 0, 0)); out.flush()
                              val t1 = Thread { relay(s.getInputStream(), t.getOutputStream(), true, cip) }
                              val t2 = Thread { relay(t.getInputStream(), s.getOutputStream(), false, cip) }
                              t1.start(); t2.start(); t1.join(); t2.join()
                          } catch (e: Exception) {
                              try { out.write(byteArrayOf(0x05, 0x05, 0x00, 0x01, 0, 0, 0, 0, 0, 0)); out.flush() } catch (ex: Exception) {}
                          } finally { try { t?.close() } catch (e: Exception) {} }
                      }
                  } catch (e: Exception) { e.printStackTrace() } finally { ProxyStats.connectionClosed() }
              }

              private fun relay(i: InputStream, o: OutputStream, up: Boolean, ip: String) {
                  try { val b = ByteArray(8192); while (!Thread.currentThread().isInterrupted) { val n = i.read(b); if (n <= 0) break; o.write(b, 0, n); o.flush(); if (up) ProxyStats.addBytesSent(n.toLong(), ip) else ProxyStats.addBytesReceived(n.toLong(), ip) } } catch (e: Exception) {}
              }

              private fun notif(): Notification {
                  val c = "s5"
