          cat > app/src/main/java/com/flownet/app/ProxyStats.kt << 'EOF'
          package com.flownet.app

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          data class RequestLog(
              val timestamp: Long,
              val method: String,
              val host: String,
              val path: String,
              val type: String,
              val size: Long = 0
          )

          data class DeviceStats(
              val ip: String,
              val requestCount: Long = 0,
              val bytesReceived: Long = 0,
              val bytesSent: Long = 0,
              val lastSeen: Long = System.currentTimeMillis()
          )

          object ProxyStats {
              private val _activeConnections = MutableStateFlow(0)
              val activeConnections: StateFlow<Int> = _activeConnections.asStateFlow()

              private val _bytesReceived = MutableStateFlow(0L)
              val bytesReceived: StateFlow<Long> = _bytesReceived.asStateFlow()

              private val _bytesSent = MutableStateFlow(0L)
              val bytesSent: StateFlow<Long> = _bytesSent.asStateFlow()

              private val _totalRequests = MutableStateFlow(0L)
              val totalRequests: StateFlow<Long> = _totalRequests.asStateFlow()

              private val _recentRequests = MutableStateFlow<List<RequestLog>>(emptyList())
              val recentRequests: StateFlow<List<RequestLog>> = _recentRequests.asStateFlow()

              private val _devices = MutableStateFlow<Map<String, DeviceStats>>(emptyMap())
              val devices: StateFlow<Map<String, DeviceStats>> = _devices.asStateFlow()

              fun connectionOpened() {
                  _activeConnections.value = _activeConnections.value + 1
              }

              fun connectionClosed() {
                  if (_activeConnections.value > 0) {
                      _activeConnections.value = _activeConnections.value - 1
                  }
              }

              fun addBytesReceived(n: Long, clientIp: String = "unknown") {
                  _bytesReceived.value = _bytesReceived.value + n
                  recordDeviceActivity(clientIp, recv = n)
              }

              fun addBytesSent(n: Long, clientIp: String = "unknown") {
                  _bytesSent.value = _bytesSent.value + n
                  recordDeviceActivity(clientIp, sent = n)
              }

              fun logRequest(method: String, host: String, path: String, type: String, size: Long = 0, clientIp: String = "unknown") {
                  _totalRequests.value = _totalRequests.value + 1
                  recordDeviceActivity(clientIp, requests = 1)
                  val log = RequestLog(System.currentTimeMillis(), method, host, path, type, size)
                  val current = _recentRequests.value
                  _recentRequests.value = (listOf(log) + current).take(50)
              }

              private fun recordDeviceActivity(ip: String, requests: Long = 0, recv: Long = 0, sent: Long = 0) {
                  if (ip == "unknown" || ip.isEmpty()) return
                  val current = _devices.value
                  val existing = current[ip] ?: DeviceStats(ip = ip)
                  val updated = existing.copy(
                      requestCount = existing.requestCount + requests,
                      bytesReceived = existing.bytesReceived + recv,
                      bytesSent = existing.bytesSent + sent,
                      lastSeen = System.currentTimeMillis()
                  )
                  _devices.value = current + (ip to updated)
              }

              fun reset() {
                  _bytesReceived.value = 0
                  _bytesSent.value = 0
                  _totalRequests.value = 0
                  _recentRequests.value = emptyList()
                  _devices.value = emptyMap()
              }

              fun formatBytes(bytes: Long): String {
                  return when {
                      bytes < 1024 -> "$bytes B"
                      bytes < 1024 * 1024 -> String.format("%.1f KB", bytes / 1024.0)
                      bytes < 1024 * 1024 * 1024 -> String.format("%.2f MB", bytes / (1024.0 * 1024.0))
                      else -> String.format("%.2f GB", bytes / (1024.0 * 1024.0 * 1024.0))
                  }
              }
          }
