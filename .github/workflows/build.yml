          cat > app/src/main/java/com/flownet/app/FileServerService.kt << 'EOF'
          package com.flownet.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.provider.OpenableColumns
          import androidx.core.app.NotificationCompat
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket

          class FileServerService : Service() {

              private var serverSocket: ServerSocket? = null
              private var serverThread: Thread? = null
              private var files: List<Uri> = emptyList()
              private var port: Int = 8081

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  port = intent?.getIntExtra("port", 8081) ?: 8081
                  val fileStrings = intent?.getStringArrayListExtra("files") ?: arrayListOf()
                  files = fileStrings.map { Uri.parse(it) }

                  startForeground(NOTIFICATION_ID, createNotification())

                  serverThread?.interrupt()
                  try { serverSocket?.close() } catch (e: Exception) {}

                  serverThread = Thread {
                      try {
                          serverSocket = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) {
                              val client = serverSocket?.accept() ?: break
                              Thread { handleClient(client) }.start()
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }.also { it.start() }

                  return START_STICKY
              }

              private fun handleClient(socket: Socket) {
                  val clientIp = getClientIp(socket)
                  socket.use { sock ->
                      try {
                          val reader = sock.getInputStream().bufferedReader()
                          val requestLine = reader.readLine() ?: return
                          val parts = requestLine.split(" ")
                          if (parts.size < 2) return
                          val path = parts[1]
                          val output = sock.getOutputStream()

                          when {
                              path == "/" || path == "/index.html" -> {
                                  val html = generateIndexHtml()
                                  val bytes = html.toByteArray(Charsets.UTF_8)
                                  val header = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: ${bytes.size}\r\nConnection: close\r\n\r\n"
                                  output.write(header.toByteArray())
                                  output.write(bytes)
                              }
                              path.startsWith("/file/") -> {
                                  val index = path.removePrefix("/file/").toIntOrNull()
                                  if (index != null && index in files.indices) {
                                      serveFile(output, files[index], clientIp)
                                  } else {
                                      sendNotFound(output)
                                  }
                              }
                              else -> sendNotFound(output)
                          }
                          output.flush()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun serveFile(output: OutputStream, uri: Uri, clientIp: String) {
                  try {
                      val inputStream = contentResolver.openInputStream(uri)
                      if (inputStream == null) { sendNotFound(output); return }
                      val fileName = getFileName(uri)
                      val mimeType = contentResolver.getType(uri) ?: "application/octet-stream"
                      val bytes = inputStream.use { it.readBytes() }
                      val header = "HTTP/1.1 200 OK\r\nContent-Type: $mimeType\r\nContent-Length: ${bytes.size}\r\nContent-Disposition: attachment; filename=\"$fileName\"\r\nConnection: close\r\n\r\n"
                      output.write(header.toByteArray())
                      output.write(bytes)
                      ProxyStats.addBytesSent(bytes.size.toLong(), clientIp)
                      ProxyStats.logRequest("GET", "fileserver", "/file/$fileName", "FILES", bytes.size.toLong(), clientIp)
                  } catch (e: Exception) { e.printStackTrace() }
              }

              private fun getFileName(uri: Uri): String {
                  var name = "file"
                  try {
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (nameIndex >= 0) name = cursor.getString(nameIndex) ?: "file"
                          }
                      }
                  } catch (e: Exception) {}
                  return name
              }

              private fun generateIndexHtml(): String {
                  val fileListHtml = files.mapIndexed { index, uri ->
                      val name = getFileName(uri)
                      "<li><a href=\"/file/$index\">📄 $name</a></li>"
                  }.joinToString("\n")
                  val bodyContent = if (files.isEmpty()) "<p class='empty'>لا توجد ملفات مشتركة</p>" else "<ul>$fileListHtml</ul>"
                  return "<!DOCTYPE html><html dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>FlowNet</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fc;margin:0;padding:20px}h1{color:#3182ce}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}ul{list-style:none;padding:0}li{padding:14px;margin:8px 0;background:#f8fafc;border-radius:10px}a{color:#1e293b;text-decoration:none;font-weight:bold}.empty{color:#94a3b8;text-align:center;padding:40px}</style></head><body><div class='card'><h1>🌐 FlowNet</h1><p>الملفات المتاحة:</p>$bodyContent</div></body></html>"
              }

              private fun sendNotFound(output: OutputStream) {
                  val msg = "404 Not Found"
                  output.write("HTTP/1.1 404 Not Found\r\nContent-Length: ${msg.length}\r\n\r\n$msg".toByteArray())
              }

              private fun createNotification(): Notification {
                  val channelId = "flownet_server"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "FlowNet Server", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("FlowNet يعمل")
                      .setContentText("خادم الملفات على المنفذ $port")
                      .setSmallIcon(android.R.drawable.ic_menu_share)
                      .setOngoing(true)
                      .build()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  serverThread?.interrupt()
                  try { serverSocket?.close() } catch (e: Exception) {}
                  super.onDestroy()
              }

              companion object {
                  private const val NOTIFICATION_ID = 1001

                  fun getClientIp(socket: Socket): String {
                      return try {
                          (socket.remoteSocketAddress as? InetSocketAddress)?.address?.hostAddress ?: "unknown"
                      } catch (e: Exception) { "unknown" }
                  }
              }
          }
          EOF
          
          cat > app/src/main/java/com/flownet/app/Socks5ProxyService.kt << 'EOF'
          package com.flownet.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.concurrent.Executors

          class Socks5ProxyService : Service() {

              private var serverSocket: ServerSocket? = null
              private var serverThread: Thread? = null
              private var port: Int = 1080
              private var password: String = ""
              private val pool = Executors.newCachedThreadPool()

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  port = intent?.getIntExtra("port", 1080) ?: 1080
                  password = intent?.getStringExtra("password") ?: ""
                  startForeground(NOTIFICATION_ID, createNotification())

                  try { serverSocket?.close() } catch (e: Exception) {}
                  serverThread?.interrupt()

                  serverThread = Thread {
                      try {
                          serverSocket = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) {
                              val client = serverSocket?.accept() ?: break
                              pool.execute { handleClient(client) }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }.also { it.start() }

                  return START_STICKY
              }

              private fun handleClient(client: Socket) {
                  val clientIp = FileServerService.getClientIp(client)
                  ProxyStats.connectionOpened()
                  try {
                      client.use { sock ->
                          sock.soTimeout = 30000
                          val input = sock.getInputStream()
                          val output = sock.getOutputStream()

                          val ver = input.read()
                          if (ver != 0x05) return
                          val nMethods = input.read()
                          if (nMethods <= 0) return
                          val methods = ByteArray(nMethods)
                          input.read(methods)

                          if (password.isNotEmpty()) {
                              val hasAuth = methods.any { it.toInt() == 0x02 }
                              if (!hasAuth) {
                                  output.write(byteArrayOf(0x05.toByte(), 0xFF.toByte()))
                                  output.flush()
                                  return
                              }
                              output.write(byteArrayOf(0x05.toByte(), 0x02.toByte()))
                              output.flush()

                              val authVer = input.read()
                              if (authVer != 0x01) return
                              val ulen = input.read()
                              val uname = ByteArray(ulen); input.read(uname)
                              val plen = input.read()
                              val passwd = ByteArray(plen); input.read(passwd)
                              val enteredPassword = String(passwd, Charsets.UTF_8)

                              if (enteredPassword != password) {
                                  output.write(byteArrayOf(0x01.toByte(), 0x01.toByte()))
                                  output.flush()
                                  return
                              }
                              output.write(byteArrayOf(0x01.toByte(), 0x00.toByte()))
                              output.flush()
                          } else {
                              output.write(byteArrayOf(0x05.toByte(), 0x00.toByte()))
                              output.flush()
                          }

                          val ver2 = input.read()
                          val cmd = input.read()
                          input.read()
                          val atyp = input.read()
                          if (ver2 != 0x05) return
                          if (cmd != 0x01) {
                              output.write(byteArrayOf(0x05.toByte(), 0x07.toByte(), 0x00.toByte(), 0x01.toByte(), 0, 0, 0, 0, 0, 0))
                              output.flush()
                              return
                          }

                          val host: String
                          when (atyp) {
                              0x01 -> {
                                  val addr = ByteArray(4); input.read(addr)
                                  host = addr.joinToString(".") { (it.toInt() and 0xFF).toString() }
                              }
                              0x03 -> {
                                  val len = input.read()
                                  val domain = ByteArray(len); input.read(domain)
                                  host = String(domain, Charsets.UTF_8)
                              }
                              0x04 -> {
                                  val addr = ByteArray(16); input.read(addr)
                                  host = InetAddress.getByAddress(addr).hostAddress ?: return
                              }
                              else -> return
                          }
                          val targetPort = (input.read() shl 8) or input.read()

                          ProxyStats.logRequest("CONNECT", host, ":$targetPort", "SOCKS5", 0, clientIp)

                          var target: Socket? = null
                          try {
                              target = Socket()
                              target.connect(InetSocketAddress(host, targetPort), 10000)
                              output.write(byteArrayOf(0x05.toByte(), 0x00.toByte(), 0x00.toByte(), 0x01.toByte(), 0, 0, 0, 0, 0, 0))
                              output.flush()

                              val t1 = Thread { relay(sock.getInputStream(), target.getOutputStream(), true, clientIp) }
                              val t2 = Thread { relay(target.getInputStream(), sock.getOutputStream(), false, clientIp) }
                              t1.start(); t2.start()
                              t1.join(); t2.join()
                          } catch (e: Exception) {
                              try {
                                  output.write(byteArrayOf(0x05.toByte(), 0x05.toByte(), 0x00.toByte(), 0x01.toByte(), 0, 0, 0, 0, 0, 0))
                                  output.flush()
                              } catch (ex: Exception) {}
                          } finally {
                              try { target?.close() } catch (e: Exception) {}
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      ProxyStats.connectionClosed()
                  }
              }

              private fun relay(input: InputStream, output: OutputStream, upload: Boolean, clientIp: String) {
                  try {
                      val buf = ByteArray(8192)
                      while (!Thread.currentThread().isInterrupted) {
                          val n = input.read(buf)
                          if (n <= 0) break
                          output.write(buf, 0, n)
                          output.flush()
                          if (upload) ProxyStats.addBytesSent(n.toLong(), clientIp)
                          else ProxyStats.addBytesReceived(n.toLong(), clientIp)
                      }
                  } catch (e: Exception) {}
              }

              private fun createNotification(): Notification {
                  val channelId = "flownet_socks5"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId, "FlowNet SOCKS5", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("FlowNet SOCKS5 يعمل")
                      .setContentText("المنفذ $port")
                      .setSmallIcon(android.R.drawable.ic_menu_share)
                      .setOngoing(true)
                      .build()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  serverThread?.interrupt()
                  try { serverSocket?.close() } catch (e: Exception) {}
                  pool.shutdownNow()
                  super.onDestroy()
              }

              companion object {
                  private const val NOTIFICATION_ID = 1002
              }
          }
          EOF
          
