          cat > app/src/main/java/com/flownet/app/QrCodeGenerator.kt << 'EOF'
          package com.flownet.app
          import android.graphics.Bitmap
          import android.graphics.Color
          import com.google.zxing.BarcodeFormat
          import com.google.zxing.EncodeHintType
          import com.google.zxing.qrcode.QRCodeWriter
          import com.google.zxing.qrcode.decoder.ErrorCorrectionLevel
          object QrCodeGenerator {
              fun generateWifiQr(ssid: String, password: String, size: Int = 600): Bitmap? = try {
                  val content = if (password.isEmpty()) "WIFI:S:$ssid;T:nopass;;" else "WIFI:S:$ssid;T:WPA;P:$password;;"
                  val hints = mapOf(EncodeHintType.ERROR_CORRECTION to ErrorCorrectionLevel.M, EncodeHintType.CHARACTER_SET to "UTF-8", EncodeHintType.MARGIN to 1)
                  val m = QRCodeWriter().encode(content, BarcodeFormat.QR_CODE, size, size, hints)
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.RGB_565)
                  for (x in 0 until size) for (y in 0 until size) bmp.setPixel(x, y, if (m.get(x, y)) Color.BLACK else Color.WHITE)
                  bmp
              } catch (e: Exception) { e.printStackTrace(); null }
          }
