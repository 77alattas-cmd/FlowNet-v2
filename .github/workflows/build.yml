name: Build FlowNet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - name: Download project config
        run: |
          curl -L "https://gist.githubusercontent.com/77alattas-cmd/bcd7b158c8c88b009f7fc5d83e383846/raw/5dea03314a7d88639078edee6587cdce0c6146ee/FlowNet.txt" -o /tmp/flownet-build.sh
          head -20 /tmp/flownet-build.sh
      - name: Execute build script
        run: |
          bash /tmp/flownet-build.sh
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowNet-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
