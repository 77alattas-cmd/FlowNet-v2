                  val clientIp = FileServerService.getClientIp(client)
                  ProxyStats.connectionOpened()
                  try {
                      client.use { sock ->
                          sock.soTimeout = 60000
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream()))
                          val output = sock.getOutputStream()

                          val requestLine = reader.readLine() ?: return
                          val parts = requestLine.split(" ")
                          if (parts.size < 2) return

                          val method = parts[0]
                          val url = parts[1]

                          val headers = mutableListOf<Pair<String, String>>()
                          var proxyAuthHeader: String? = null
                          var line: String?
                          while (true) {
                              line = reader.readLine() ?: break
                              if (line.isEmpty()) break
                              val idx = line.indexOf(':')
                              if (idx > 0) {
                                  val name = line.substring(0, idx).trim()
                                  val value = line.substring(idx + 1).trim()
                                  if (name.equals("Proxy-Authorization", ignoreCase = true)) {
                                      proxyAuthHeader = value
                                  } else {
                                      headers.add(name to value)
                                  }
                              }
                          }

                          if (password.isNotEmpty()) {
                              var authenticated = false
                              if (proxyAuthHeader != null && proxyAuthHeader.startsWith("Basic ", ignoreCase = true)) {
                                  try {
                                      val encoded = proxyAuthHeader.substring(6).trim()
                                      val decoded = String(Base64.getDecoder().decode(encoded), Charsets.UTF_8)
                                      val colonIdx = decoded.indexOf(':')
                                      if (colonIdx >= 0) {
                                          val pass = decoded.substring(colonIdx + 1)
                                          if (pass == password) authenticated = true
                                      }
                                  } catch (e: Exception) {}
                              }
                              if (!authenticated) {
                                  output.write("HTTP/1.1 407 Proxy Authentication Required\r\nProxy-Authenticate: Basic realm=\"FlowNet\"\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".toByteArray())
                                  output.flush()
                                  return
                              }
                          }

                          if (method.equals("CONNECT", ignoreCase = true)) {
                              val hostPort = url.split(":")
                              val host = hostPort[0]
                              val targetPort = hostPort.getOrNull(1)?.toIntOrNull() ?: 443

                              ProxyStats.logRequest("CONNECT", host, ":$targetPort", "HTTP", 0, clientIp)

                              val target = Socket()
                              target.connect(InetSocketAddress(host, targetPort), 15000)
                              output.write("HTTP/1.1 200 Connection Established\r\n\r\n".toByteArray())
                              output.flush()

                              val t1 = Thread { relay(sock.getInputStream(), target.getOutputStream(), true, clientIp) }
                              val t2 = Thread { relay(target.getInputStream(), sock.getOutputStream(), false, clientIp) }
                              t1.start(); t2.start()
                              t1.join(); t2.join()

                              try { target.close() } catch (e: Exception) {}
                          } else {
                              val uri = URI(url)
                              val host = uri.host ?: return
                              val targetPort = if (uri.port > 0) uri.port else 80
                              val path = (uri.rawPath ?: "/") + (uri.rawQuery?.let { "?$it" } ?: "")

                              ProxyStats.logRequest(method, host, path, "HTTP", 0, clientIp)

                              val target = Socket()
                              target.connect(InetSocketAddress(host, targetPort), 15000)
                              val targetOut = target.getOutputStream()

                              val requestBuilder = StringBuilder()
                              requestBuilder.append("$method $path HTTP/1.1\r\n")
                              requestBuilder.append("Host: $host\r\n")

                              headers.forEach { (k, v) ->
                                  if (!k.equals("Proxy-Connection", ignoreCase = true) &&
                                      !k.equals("Connection", ignoreCase = true)) {
                                      requestBuilder.append("$k: $v\r\n")
                                  }
                              }
                              requestBuilder.append("Connection: close\r\n")
                              requestBuilder.append("\r\n")

                              targetOut.write(requestBuilder.toString().toByteArray())
                              targetOut.flush()

                              relay(target.getInputStream(), output, false, clientIp)

                              try { target.close() } catch (e: Exception) {}
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      ProxyStats.connectionClosed()
                  }
              }

              private fun relay(input: InputStream, output: OutputStream, upload: Boolean, clientIp: String) {
                  try {
                      val buf = ByteArray(8192)
                      while (!Thread.currentThread().isInterrupted) {
                          val n = input.read(buf)
                          if (n <= 0) break
                          output.write(buf, 0, n)
                          output.flush()
                          if (upload) ProxyStats.addBytesSent(n.toLong(), clientIp)
                          else ProxyStats.addBytesReceived(n.toLong(), clientIp)
                      }
                  } catch (e: Exception) {}
              }

              private fun createNotification(): Notification {
                  val channelId = "flownet_http"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId, "FlowNet HTTP Proxy", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("FlowNet HTTP Proxy يعمل")
                      .setContentText("المنفذ $port")
                      .setSmallIcon(android.R.drawable.ic_menu_share)
                      .setOngoing(true)
                      .build()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  serverThread?.interrupt()
                  try { serverSocket?.close() } catch (e: Exception) {}
                  pool.shutdownNow()
                  super.onDestroy()
              }

              companion object {
                  private const val NOTIFICATION_ID = 1003
              }
          }
