          cat > app/src/main/java/com/flownet/app/ProxyStats.kt << 'EOF'
          package com.flownet.app
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          data class RequestLog(val timestamp: Long, val method: String, val host: String, val path: String, val type: String, val size: Long = 0)
          data class DeviceStats(val ip: String, val requestCount: Long = 0, val bytesReceived: Long = 0, val bytesSent: Long = 0, val lastSeen: Long = System.currentTimeMillis())
          object ProxyStats {
              private val _activeConnections = MutableStateFlow(0)
              val activeConnections: StateFlow<Int> = _activeConnections.asStateFlow()
              private val _bytesReceived = MutableStateFlow(0L)
              val bytesReceived: StateFlow<Long> = _bytesReceived.asStateFlow()
              private val _bytesSent = MutableStateFlow(0L)
              val bytesSent: StateFlow<Long> = _bytesSent.asStateFlow()
              private val _totalRequests = MutableStateFlow(0L)
              val totalRequests: StateFlow<Long> = _totalRequests.asStateFlow()
              private val _recentRequests = MutableStateFlow<List<RequestLog>>(emptyList())
              val recentRequests: StateFlow<List<RequestLog>> = _recentRequests.asStateFlow()
              private val _devices = MutableStateFlow<Map<String, DeviceStats>>(emptyMap())
              val devices: StateFlow<Map<String, DeviceStats>> = _devices.asStateFlow()
              fun connectionOpened() { _activeConnections.value++ }
              fun connectionClosed() { if (_activeConnections.value > 0) _activeConnections.value-- }
              fun addBytesReceived(n: Long, ip: String = "unknown") { _bytesReceived.value += n; recordDevice(ip, recv = n) }
              fun addBytesSent(n: Long, ip: String = "unknown") { _bytesSent.value += n; recordDevice(ip, sent = n) }
              fun logRequest(m: String, h: String, p: String, t: String, s: Long = 0, ip: String = "unknown") {
                  _totalRequests.value++
                  recordDevice(ip, requests = 1)
                  _recentRequests.value = (listOf(RequestLog(System.currentTimeMillis(), m, h, p, t, s)) + _recentRequests.value).take(50)
              }
              private fun recordDevice(ip: String, requests: Long = 0, recv: Long = 0, sent: Long = 0) {
                  if (ip == "unknown" || ip.isEmpty()) return
                  val c = _devices.value
                  val e = c[ip] ?: DeviceStats(ip = ip)
                  _devices.value = c + (ip to e.copy(requestCount = e.requestCount + requests, bytesReceived = e.bytesReceived + recv, bytesSent = e.bytesSent + sent, lastSeen = System.currentTimeMillis()))
              }
              fun reset() { _bytesReceived.value = 0; _bytesSent.value = 0; _totalRequests.value = 0; _recentRequests.value = emptyList(); _devices.value = emptyMap() }
              fun formatBytes(b: Long): String = when {
                  b < 1024 -> "$b B"
                  b < 1048576 -> String.format("%.1f KB", b / 1024.0)
                  b < 1073741824 -> String.format("%.2f MB", b / 1048576.0)
                  else -> String.format("%.2f GB", b / 1073741824.0)
              }
          }
          EOF
          cat > app/src/main/java/com/flownet/app/NetworkInfo.kt << 'EOF'
          package com.flownet.app
          import java.net.Inet4Address
          import java.net.NetworkInterface
          data class NetworkIp(val label: String, val ip: String, val emoji: String, val isPermanent: Boolean = false)
          fun getAllNetworkIps(): List<NetworkIp> {
              val r = mutableListOf<NetworkIp>()
              val seen = mutableSetOf<String>()
              try {
                  val ifs = NetworkInterface.getNetworkInterfaces() ?: return r
                  while (ifs.hasMoreElements()) {
                      val iface = ifs.nextElement()
                      if (!iface.isUp || iface.isLoopback) continue
                      val name = iface.name
                      val addrs = iface.inetAddresses
                      while (addrs.hasMoreElements()) {
                          val a = addrs.nextElement()
                          if (a.isLoopbackAddress || a !is Inet4Address) continue
                          val ip = a.hostAddress ?: continue
                          if (ip in seen) continue
                          seen.add(ip)
                          r.add(when {
                              name.startsWith("p2p") || ip.startsWith("192.168.49.") -> NetworkIp("WiFi Direct", ip, "📡", true)
                              ip.startsWith("192.168.43.") -> NetworkIp("Hotspot", ip, "🔥")
                              ip.startsWith("192.168.42.") -> NetworkIp("USB", ip, "🔌")
                              else -> NetworkIp("WiFi / LAN", ip, "📶")
                          })
                      }
                  }
              } catch (e: Exception) {}
              return r.sortedWith(compareByDescending<NetworkIp> { it.isPermanent }.thenBy { it.ip })
          }
