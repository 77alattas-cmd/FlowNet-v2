name: Build FlowNet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/flownet/app
          
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FlowNet"
          include ':app'
          EOF
          
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.20' apply false
              id 'org.jetbrains.kotlin.plugin.compose' version '2.0.20' apply false
          }
          EOF
          
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'org.jetbrains.kotlin.plugin.compose'
          }
          android {
              namespace 'com.flownet.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.flownet.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.activity:activity-compose:1.9.2'
              implementation platform('androidx.compose:compose-bom:2024.09.03')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="FlowNet"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FileServerService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/flownet/app/FileServerService.kt << 'EOF'
          package com.flownet.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.provider.OpenableColumns
          import androidx.core.app.NotificationCompat
          import java.io.OutputStream
          import java.net.ServerSocket
          import java.net.Socket

          class FileServerService : Service() {

              private var serverSocket: ServerSocket? = null
              private var serverThread: Thread? = null
              private var files: List<Uri> = emptyList()
              private var port: Int = 8080

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  port = intent?.getIntExtra("port", 8080) ?: 8080
                  val fileStrings = intent?.getStringArrayListExtra("files") ?: arrayListOf()
                  files = fileStrings.map { Uri.parse(it) }

                  startForeground(NOTIFICATION_ID, createNotification())

                  serverThread?.interrupt()
                  serverSocket?.close()

                  serverThread = Thread {
                      try {
                          serverSocket = ServerSocket(port)
                          while (!Thread.currentThread().isInterrupted) {
                              val client = serverSocket?.accept() ?: break
                              Thread { handleClient(client) }.start()
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }.also { it.start() }

                  return START_STICKY
              }

              private fun handleClient(socket: Socket) {
                  socket.use { sock ->
                      try {
                          val reader = sock.getInputStream().bufferedReader()
                          val requestLine = reader.readLine() ?: return
                          val parts = requestLine.split(" ")
                          if (parts.size < 2) return
                          val path = parts[1]

                          val output = sock.getOutputStream()

                          when {
                              path == "/" || path == "/index.html" -> {
                                  val html = generateIndexHtml()
                                  val bytes = html.toByteArray(Charsets.UTF_8)
                                  val header = "HTTP/1.1 200 OK\r\n" +
                                          "Content-Type: text/html; charset=utf-8\r\n" +
                                          "Content-Length: ${bytes.size}\r\n" +
                                          "Connection: close\r\n\r\n"
                                  output.write(header.toByteArray())
                                  output.write(bytes)
                              }
                              path.startsWith("/file/") -> {
                                  val index = path.removePrefix("/file/").toIntOrNull()
                                  if (index != null && index in files.indices) {
                                      serveFile(output, files[index])
                                  } else {
                                      sendNotFound(output)
                                  }
                              }
                              else -> sendNotFound(output)
                          }
                          output.flush()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun serveFile(output: OutputStream, uri: Uri) {
                  try {
                      val inputStream = contentResolver.openInputStream(uri)
                      if (inputStream == null) {
                          sendNotFound(output)
                          return
                      }
                      val fileName = getFileName(uri)
                      val mimeType = contentResolver.getType(uri) ?: "application/octet-stream"
                      val bytes = inputStream.use { it.readBytes() }

                      val header = "HTTP/1.1 200 OK\r\n" +
                              "Content-Type: $mimeType\r\n" +
                              "Content-Length: ${bytes.size}\r\n" +
                              "Content-Disposition: attachment; filename=\"$fileName\"\r\n" +
                              "Connection: close\r\n\r\n"
                      output.write(header.toByteArray())
                      output.write(bytes)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun getFileName(uri: Uri): String {
                  var name = "file"
                  try {
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          if (cursor.moveToFirst()) {
                              val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (nameIndex >= 0) {
                                  name = cursor.getString(nameIndex) ?: "file"
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  return name
              }

              private fun generateIndexHtml(): String {
                  val fileListHtml = files.mapIndexed { index, uri ->
                      val name = getFileName(uri)
                      "<li><a href=\"/file/$index\">📄 $name</a></li>"
                  }.joinToString("\n")

                  val bodyContent = if (files.isEmpty()) {
                      "<p class='empty'>لا توجد ملفات مشتركة حالياً</p>"
                  } else {
                      "<ul>$fileListHtml</ul>"
                  }

                  return "<!DOCTYPE html>" +
                          "<html dir='rtl'>" +
                          "<head>" +
                          "<meta charset='utf-8'>" +
                          "<meta name='viewport' content='width=device-width, initial-scale=1'>" +
                          "<title>FlowNet</title>" +
                          "<style>" +
                          "body { font-family: system-ui, sans-serif; background: #f4f7fc; margin: 0; padding: 20px; }" +
                          "h1 { color: #3182ce; }" +
                          ".card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }" +
                          "ul { list-style: none; padding: 0; }" +
                          "li { padding: 14px; margin: 8px 0; background: #f8fafc; border-radius: 10px; }" +
                          "a { color: #1e293b; text-decoration: none; font-weight: bold; }" +
                          "a:hover { color: #3182ce; }" +
                          ".empty { color: #94a3b8; text-align: center; padding: 40px; }" +
                          "</style>" +
                          "</head>" +
                          "<body>" +
                          "<div class='card'>" +
                          "<h1>🌐 FlowNet</h1>" +
                          "<p>الملفات المتاحة للمشاركة:</p>" +
                          bodyContent +
                          "</div>" +
                          "</body>" +
                          "</html>"
              }

              private fun sendNotFound(output: OutputStream) {
                  val msg = "404 Not Found"
                  val response = "HTTP/1.1 404 Not Found\r\nContent-Length: ${msg.length}\r\n\r\n$msg"
                  output.write(response.toByteArray())
              }

              private fun createNotification(): Notification {
                  val channelId = "flownet_server"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "FlowNet Server",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("FlowNet يعمل")
                      .setContentText("خادم الملفات نشط على المنفذ $port")
                      .setSmallIcon(android.R.drawable.ic_menu_share)
                      .setOngoing(true)
                      .build()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  serverThread?.interrupt()
                  try { serverSocket?.close() } catch (e: Exception) {}
                  super.onDestroy()
              }

              companion object {
                  private const val NOTIFICATION_ID = 1001
              }
          }
          EOF
          
          cat > app/src/main/java/com/flownet/app/MainActivity.kt << 'EOF'
          package com.flownet.app

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.net.Inet4Address
          import java.net.NetworkInterface

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          FlowNetScreen()
                      }
                  }
              }
          }

          @Composable
          fun FlowNetScreen() {
              val context = LocalContext.current
              var isRunning by rememberSaveable { mutableStateOf(false) }
              var selectedFiles by remember { mutableStateOf<List<Uri>>(emptyList()) }
              val localIp = remember { getLocalIpAddress() }

              val filePicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenMultipleDocuments()
              ) { uris ->
                  if (uris.isNotEmpty()) {
                      selectedFiles = selectedFiles + uris
                  }
              }

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = Color(0xFFF4F7FC)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(20.dp),
                      verticalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      Text(
                          text = "FlowNet",
                          fontSize = 28.sp,
                          fontWeight = FontWeight.Bold,
                          color = Color(0xFF1E293B)
                      )

                      Text(
                          text = "مشاركة الملفات مع الأصدقاء",
                          fontSize = 14.sp,
                          color = Color(0xFF64748B)
                      )

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(16.dp),
                          colors = CardDefaults.cardColors(
                              containerColor = if (isRunning) Color(0xFF3182CE) else Color.White
                          )
                      ) {
                          Column(modifier = Modifier.padding(20.dp)) {
                              Text(
                                  text = if (isRunning) "الخدمة تعمل" else "الخدمة متوقفة",
                                  color = if (isRunning) Color.White else Color(0xFF1E293B),
                                  fontSize = 20.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Spacer(Modifier.height(12.dp))
                              Text(
                                  text = "IP المحلي: $localIp",
                                  color = if (isRunning) Color.White.copy(alpha = 0.9f) else Color(0xFF64748B),
                                  fontSize = 14.sp
                              )
                              Spacer(Modifier.height(4.dp))
                              Text(
                                  text = "الرابط: http://$localIp:8080",
                                  color = if (isRunning) Color.White.copy(alpha = 0.9f) else Color(0xFF64748B),
                                  fontSize = 14.sp
                              )
                          }
                      }

                      Button(
                          onClick = { filePicker.launch(arrayOf("*/*")) },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp),
                          shape = RoundedCornerShape(12.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF3182CE))
                      ) {
                          Text("📁 اختر ملفات للمشاركة", fontSize = 15.sp, fontWeight = FontWeight.Bold)
                      }

                      if (selectedFiles.isNotEmpty()) {
                          Card(
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(16.dp),
                              colors = CardDefaults.cardColors(containerColor = Color.White)
                          ) {
                              Column(modifier = Modifier.padding(16.dp)) {
                                  Text(
                                      text = "الملفات المشتركة (${selectedFiles.size})",
                                      fontSize = 14.sp,
                                      fontWeight = FontWeight.Bold,
                                      color = Color(0xFF1E293B)
                                  )
                                  Spacer(Modifier.height(8.dp))
                                  selectedFiles.forEachIndexed { index, uri ->
                                      Row(
                                          modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              text = "📄 ${getFileName(context, uri).take(30)}",
                                              fontSize = 12.sp,
                                              color = Color(0xFF64748B),
                                              modifier = Modifier.weight(1f)
                                          )
                                          TextButton(onClick = {
                                              selectedFiles = selectedFiles.filterIndexed { i, _ -> i != index }
                                          }) {
                                              Text("حذف", fontSize = 11.sp, color = Color(0xFFE53E3E))
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      Button(
                          onClick = {
                              if (isRunning) {
                                  context.stopService(Intent(context, FileServerService::class.java))
                                  isRunning = false
                              } else {
                                  if (selectedFiles.isEmpty()) return@Button
                                  val intent = Intent(context, FileServerService::class.java).apply {
                                      putStringArrayListExtra("files", ArrayList(selectedFiles.map { it.toString() }))
                                      putExtra("port", 8080)
                                  }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      context.startForegroundService(intent)
                                  } else {
                                      context.startService(intent)
                                  }
                                  isRunning = true
                              }
                          },
                          enabled = isRunning || selectedFiles.isNotEmpty(),
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(56.dp),
                          shape = RoundedCornerShape(12.dp),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (isRunning) Color(0xFFE53E3E) else Color(0xFF38A169),
                              disabledContainerColor = Color(0xFFCBD5E0)
                          )
                      ) {
                          Text(
                              text = if (isRunning) "إيقاف الخدمة" else "🚀 تشغيل الخدمة",
                              fontSize = 16.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }

                      if (isRunning) {
                          Card(
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(16.dp),
                              colors = CardDefaults.cardColors(containerColor = Color.White)
                          ) {
                              Column(modifier = Modifier.padding(20.dp)) {
                                  Text(
                                      text = "كيف يشارك أصدقاؤك؟",
                                      fontSize = 16.sp,
                                      fontWeight = FontWeight.Bold,
                                      color = Color(0xFF1E293B)
                                  )
                                  Spacer(Modifier.height(12.dp))
                                  Text(
                                      text = "1. فعّل نقطة اتصال (Hotspot) على جوالك\n\n" +
                                              "2. اطلب من صديقك الاتصال بنفس الشبكة\n\n" +
                                              "3. اطلب منه فتح المتصفح على:\n" +
                                              "   http://$localIp:8080",
                                      fontSize = 13.sp,
                                      color = Color(0xFF64748B),
                                      lineHeight = 22.sp
                                  )
                              }
                          }
                      }

                      Text(
                          text = "الملفات تُرسل عبر شبكتك المحلية فقط. لا يُرسل شيء للإنترنت.",
                          fontSize = 11.sp,
                          color = Color(0xFF94A3B8)
                      )
                  }
              }
          }

          fun getFileName(context: android.content.Context, uri: Uri): String {
              var name = "file"
              try {
                  context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (idx >= 0) name = cursor.getString(idx) ?: "file"
                      }
                  }
              } catch (e: Exception) {}
              return name
          }

          fun getLocalIpAddress(): String {
              try {
                  val interfaces = NetworkInterface.getNetworkInterfaces() ?: return "غير متاح"
                  while (interfaces.hasMoreElements()) {
                      val iface = interfaces.nextElement()
                      if (!iface.isUp || iface.isLoopback) continue
                      val addresses = iface.inetAddresses
                      while (addresses.hasMoreElements()) {
                          val addr = addresses.nextElement()
                          if (!addr.isLoopbackAddress && addr is Inet4Address) {
                              val ip = addr.hostAddress ?: continue
                              if (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")) {
                                  return ip
                              }
                          }
                      }
                  }
              } catch (e: Exception) {}
              return "غير متاح"
          }
          EOF
          
          echo "✅ ملفات المشروع جاهزة"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowNet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
