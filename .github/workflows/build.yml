name: Build FlowNet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - name: Download and run script
        run: |
          curl -L "https://gist.githubusercontent.com/77alattas-cmd/a38e4c9577b21e7d0795ab6daaaa11f5/raw/d10180faa507f21057cd82a0318166c8289f3595/script.sh" -o flow.sh
          chmod +x flow.sh
          bash flow.sh
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowNet-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
