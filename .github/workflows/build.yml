                                  context.startForegroundService(i) else context.startService(i)
                              onRunningChange(true)
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      shape = RoundedCornerShape(12.dp),
                      colors = ButtonDefaults.buttonColors(
                          containerColor = if (isRunning) Color(0xFFE53E3E) else Color(0xFF38A169)
                      )
                  ) { Text(if (isRunning) "إيقاف" else "🚀 تشغيل SOCKS5", fontSize = 16.sp, fontWeight = FontWeight.Bold) }
              }
          }

          @Composable
          fun FileSharingScreen(
              isRunning: Boolean,
              networks: List<NetworkIp>,
              onRefresh: () -> Unit,
              onRunningChange: (Boolean) -> Unit
          ) {
              val context = LocalContext.current
              var selectedFiles by remember { mutableStateOf<List<Uri>>(emptyList()) }

              val filePicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenMultipleDocuments()
              ) { uris -> if (uris.isNotEmpty()) selectedFiles = selectedFiles + uris }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text("مشاركة الملفات", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1E293B))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(16.dp),
                      colors = CardDefaults.cardColors(
                          containerColor = if (isRunning) Color(0xFF3182CE) else Color.White
                      )
                  ) {
                      Column(modifier = Modifier.padding(20.dp)) {
                          Text(
                              if (isRunning) "الخدمة تعمل" else "الخدمة متوقفة",
                              color = if (isRunning) Color.White else Color(0xFF1E293B),
                              fontSize = 18.sp, fontWeight = FontWeight.Bold
                          )
                          Spacer(Modifier.height(8.dp))
                          Text("Port: 8081",
                              color = if (isRunning) Color.White.copy(alpha = 0.9f) else Color(0xFF64748B),
                              fontSize = 13.sp)
                      }
                  }

                  NetworksCard(networks, onRefresh)

                  Button(
                      onClick = { filePicker.launch(arrayOf("*/*")) },
                      modifier = Modifier.fillMaxWidth().height(52.dp),
                      shape = RoundedCornerShape(12.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF3182CE))
                  ) { Text("📁 اختر ملفات", fontSize = 15.sp) }

                  if (selectedFiles.isNotEmpty()) {
                      Text("الملفات (${selectedFiles.size})", fontSize = 14.sp,
                          fontWeight = FontWeight.Bold, color = Color(0xFF1E293B))
                      selectedFiles.forEachIndexed { i, uri ->
                          Row(modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically) {
                              Text(getFileName(context, uri).take(28),
                                  fontSize = 12.sp, color = Color(0xFF64748B),
                                  modifier = Modifier.weight(1f))
                              TextButton(onClick = {
                                  selectedFiles = selectedFiles.filterIndexed { j, _ -> j != i }
                              }) { Text("حذف", fontSize = 11.sp, color = Color(0xFFE53E3E)) }
                          }
                      }
                  }

                  Button(
                      onClick = {
                          if (isRunning) {
                              context.stopService(Intent(context, FileServerService::class.java))
                              onRunningChange(false)
                          } else {
                              if (selectedFiles.isEmpty()) return@Button
                              val i = Intent(context, FileServerService::class.java).apply {
                                  putStringArrayListExtra("files", ArrayList(selectedFiles.map { it.toString() }))
                                  putExtra("port", 8081)
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                                  context.startForegroundService(i) else context.startService(i)
                              onRunningChange(true)
                          }
                      },
                      enabled = isRunning || selectedFiles.isNotEmpty(),
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      shape = RoundedCornerShape(12.dp),
                      colors = ButtonDefaults.buttonColors(
                          containerColor = if (isRunning) Color(0xFFE53E3E) else Color(0xFF38A169),
                          disabledContainerColor = Color(0xFFCBD5E0)
                      )
                  ) { Text(if (isRunning) "إيقاف" else "🚀 تشغيل", fontSize = 16.sp, fontWeight = FontWeight.Bold) }
              }
          }

          fun getFileName(context: android.content.Context, uri: Uri): String {
              var name = "file"
              try {
                  context.contentResolver.query(uri, null, null, null, null)?.use { c ->
                      if (c.moveToFirst()) {
                          val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (i >= 0) name = c.getString(i) ?: "file"
                      }
                  }
              } catch (e: Exception) {}
              return name
          }
          EOF
          
          echo "✅ ملفات المشروع جاهزة"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowNet-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
