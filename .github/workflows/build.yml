          cat > app/src/main/java/com/flownet/app/NetworkInfo.kt << 'EOF'
          package com.flownet.app

          import java.net.Inet4Address
          import java.net.NetworkInterface

          data class NetworkIp(
              val label: String,
              val ip: String,
              val emoji: String,
              val isPermanent: Boolean = false
          )

          fun getAllNetworkIps(): List<NetworkIp> {
              val result = mutableListOf<NetworkIp>()
              val seen = mutableSetOf<String>()
              try {
                  val interfaces = NetworkInterface.getNetworkInterfaces() ?: return result
                  while (interfaces.hasMoreElements()) {
                      val iface = interfaces.nextElement()
                      if (!iface.isUp || iface.isLoopback) continue
                      val addrs = iface.inetAddresses
                      while (addrs.hasMoreElements()) {
                          val addr = addrs.nextElement()
                          if (addr.isLoopbackAddress || addr !is Inet4Address) continue
                          val ip = addr.hostAddress ?: continue
                          if (ip in seen) continue
                          seen.add(ip)

                          val info = when {
                              ip.startsWith("192.168.49.") -> NetworkIp(
                                  "WiFi Direct (أنت المضيف)", ip, "📡", isPermanent = true)
                              ip.startsWith("192.168.43.") -> NetworkIp(
                                  "Hotspot", ip, "🔥")
                              ip.startsWith("192.168.42.") -> NetworkIp(
                                  "USB Tethering", ip, "🔌")
                              ip.startsWith("192.168.44.") -> NetworkIp(
                                  "Hotspot (بديل)", ip, "🔥")
                              ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.") ->
                                  NetworkIp("WiFi / LAN", ip, "📶")
                              else -> continue
                          }
                          result.add(info)
                      }
                  }
              } catch (e: Exception) {}
              return result.sortedByDescending { it.isPermanent }
          }

          fun getLocalIpAddress(): String {
              val ips = getAllNetworkIps()
              return ips.firstOrNull()?.ip ?: "غير متاح"
          }
